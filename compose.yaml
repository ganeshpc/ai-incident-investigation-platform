# Local PostgreSQL for the investigation backend.
# The backend, AI service, and UI are added when the full local environment is assembled.
# Credentials here are the local placeholders from .env.example, not production secrets.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investigator}
      POSTGRES_USER: ${POSTGRES_USER:-investigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investigator}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - investigator-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investigator-postgres:
